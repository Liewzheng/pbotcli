# CI: format, lint, and test every push to the long-lived branches and every
# pull request. The same three checks the local `make check` gate runs
# (`cargo fmt --all -- --check`, clippy `-D warnings`, `cargo test`), with two
# deliberate differences: every cargo command here passes `--locked`, so a
# Cargo.toml change that never reached the committed Cargo.lock fails this job
# instead of a developer's inner loop; and the matrix covers macOS and Windows
# as well, since config paths and permission handling are platform-sensitive.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt · clippy · test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --workspace
