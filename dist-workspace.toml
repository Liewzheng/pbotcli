[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# `msi` is handled by a separate `build-windows-msi` job in release.yml
# (cargo-wix invoked directly on windows-latest); cargo-dist 0.32/0.33's
# WiX-key detection on pbotcli-cli's Cargo.toml is broken under our
# workspace layout, so the msi installer stays out of cargo-dist's
# pipeline. The hand-edited release.yml glues the msi artifact into the
# final release alongside cargo-dist's other installers.
# `homebrew` is here so cargo-dist emits a formula on every build; the
# matching `publish-homebrew-formula` job (also hand-merged into
# release.yml by PLANECLI-86) then pushes that formula into the
# Liewzheng/homebrew-tap at every tagged release — see `tap` / `formula`
# below and `publish-jobs` later in this section.
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Accept hand-edits to the generated `release.yml` workflow (cargo-dist's
# `plan` step rejects the release otherwise). The hand-edits here add the
# `build-mac-dmg`, `build-windows-msi`, `build-linux-deb` and
# `publish-homebrew-formula` jobs — none of those is a built-in cargo-dist
# installer / publish step on pbotcli's setup.
allow-dirty = ["ci"]
# Publish the cargo-dist-generated Homebrew formula into the personal tap
# `github.com/Liewzheng/homebrew-tap` at every tagged release. The
# generated publish job reads `secrets.HOMEBREW_TAP_TOKEN` (a classic PAT
# with `repo` scope on the tap) and is hand-merged into release.yml by
# PLANECLI-86 alongside the three other hand-written jobs (cargo-dist's
# `allow-dirty = ["ci"]` keeps it from rewriting the whole file).
publish-jobs = ["homebrew"]
# Name the formula `pbotcli` rather than the cargo-dist app default (which
# would derive from the package name `pbotcli-cli`). The install surface
# (`brew install pbotcli`) and the binaries it ships (`pbotcli` + `pbot`)
# match README and the Cargo.toml `[[bin]]` targets.
tap = "Liewzheng/homebrew-tap"
formula = "pbotcli"
